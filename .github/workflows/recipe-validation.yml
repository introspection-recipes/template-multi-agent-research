name: recipe validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate recipe
        run: npx -y -p @introspection-ai/cli@0.32.0 introspection check --work-dir . --output table --non-interactive
